<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNKNOWN — Explore</title>
  <meta name="description" content="Explore global trends and signals across the internet.">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./polish.css">
</head>
<body>
  <header class="nav">
    <a href="./" class="logo brand-lockup"><img src="./assets/unknown-mark.png" alt="" aria-hidden="true"> <span>UNKNOWN</span></a>
    <nav>
      <a href="./">TRENDS</a>
      <a class="active" href="./explore.html" aria-current="page">EXPLORE</a>
      <a href="./about.html">ABOUT</a>
    </nav>
  </header>
  <main>
    <section class="explore">
      <div class="explore-head">
        <div>
          <p class="eyebrow explore-kicker"><span></span> LIVE SIGNAL INDEX</p>
          <h1>Find a signal.</h1>
          <p class="explore-intro">Search the current global signal set and inspect why a topic is moving.</p>
        </div>
        <div class="explore-meta">
          <span class="explore-count" id="exploreCount">LOADING</span>
          <span class="explore-source">GOOGLE TRENDS · 10 REGIONS</span>
        </div>
      </div>
      <div class="explore-search">
        <input id="exploreInput" type="search" placeholder="Search signals..." autocomplete="off" aria-label="Search signals">
        <span aria-hidden="true">⌕</span>
      </div>
      <div class="explore-filters">
        <button class="explore-filter active" type="button" data-filter="all" aria-pressed="true">ALL SIGNALS</button>
        <button class="explore-filter" type="button" data-filter="RISING" aria-pressed="false">RISING</button>
        <button class="explore-filter" type="button" data-filter="NEW" aria-pressed="false">NEW</button>
        <button class="explore-filter" type="button" data-filter="COOLING" aria-pressed="false">COOLING</button>
        <button class="explore-filter" type="button" data-filter="BREAKOUT" aria-pressed="false">BREAKOUT</button>
      </div>
      <div id="exploreResults" class="explore-results" aria-live="polite" aria-busy="true">
        <div class="explore-empty"><strong>Loading live signals…</strong><span>Fetching the latest global trend data.</span></div>
      </div>
    </section>
  </main>
  <footer>
    <span>UNKNOWN</span>
    <span>Global Trend Intelligence</span>
  </footer>
  <noscript>
    <div style="padding: 24px; font-family: sans-serif; color: #111;">JavaScript is required to explore signals.</div>
  </noscript>
  <script src="./script.js"></script>
</body>
</html>
