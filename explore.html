<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNKNOWN — Explore</title>
  <meta name="description" content="Explore social trends and signals across the internet.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="nav">
    <a href="./" class="logo">UNKNOWN</a>
    <nav>
      <a href="./">TRENDS</a>
      <a href="./explore.html">EXPLORE</a>
      <a href="./about.html">ABOUT</a>
    </nav>
  </header>

  <main>
    <section class="explore">
      <div class="explore-head">
        <div>
          <p class="eyebrow">EXPLORE</p>
          <h1>Find a signal.</h1>
          <p class="explore-intro">Search the current global signal set and inspect why a topic is moving.</p>
        </div>
        <div class="explore-meta">
          <span class="explore-count" id="exploreCount">LOADING</span>
          <span class="explore-source">GOOGLE TRENDS · 10 REGIONS</span>
        </div>
      </div>

      <div class="explore-search">
        <input id="exploreInput" type="search" placeholder="Search signals..." autocomplete="off" aria-label="Search signals">
        <span aria-hidden="true">⌕</span>
      </div>

      <div class="explore-filters">
        <button class="explore-filter active" type="button" data-filter="all">ALL SIGNALS</button>
        <button class="explore-filter" type="button" data-filter="RISING">RISING</button>
        <button class="explore-filter" type="button" data-filter="NEW">NEW</button>
        <button class="explore-filter" type="button" data-filter="COOLING">COOLING</button>
      </div>

      <div id="exploreResults" class="explore-results" aria-live="polite">
        <div class="explore-empty"><strong>Loading live signals…</strong><span>Fetching the latest global trend data.</span></div>
      </div>
    </section>
  </main>

  <footer>
    <span>UNKNOWN</span>
    <span>Social Trend Intelligence</span>
  </footer>

  <noscript>
    <div style="padding: 24px; font-family: sans-serif; color: #111;">JavaScript is required to explore signals.</div>
  </noscript>

  <script src="./script.js"></script>
</body>
</html>
