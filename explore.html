<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNKNOWN — Explore</title>
  <meta name="description" content="Search the current global signal set.">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="./"><img class="mark" src="./assets/unknown-mark.png" alt=""> <span>UNKNOWN</span></a>
      <nav>
        <a href="./"><span class="ico">↗</span>Trends</a>
        <a class="active" href="./explore.html" aria-current="page"><span class="ico">⌕</span>Explore</a>
        <a href="./about.html"><span class="ico">i</span>About</a>
      </nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <h1>Explore</h1>
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="exploreInput" type="search" placeholder="Search" autocomplete="off" aria-label="Search signals">
        </label>
      </header>
      <main>
        <div class="toolbar">
          <div class="filters">
            <button class="explore-filter active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="explore-filter" type="button" data-filter="NEW" aria-pressed="false">New</button>
            <button class="explore-filter" type="button" data-filter="RISING" aria-pressed="false">Rising</button>
            <button class="explore-filter" type="button" data-filter="COOLING" aria-pressed="false">Cooling</button>
            <button class="explore-filter" type="button" data-filter="BREAKOUT" aria-pressed="false">Breakout</button>
          </div>
          <span class="count" id="exploreCount">—</span>
        </div>
        <div id="exploreResults" class="rows explore-results" aria-live="polite" aria-busy="true"></div>
      </main>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
