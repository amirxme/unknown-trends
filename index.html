<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNKNOWN — Trends</title>
  <meta name="description" content="See what is moving across ten regions.">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="./"><span class="mark" aria-hidden="true">✕</span><span>UNKNOWN</span></a>
      <nav>
        <a class="active" href="./" aria-current="page"><span class="ico">↗</span>Trends</a>
        <a href="./explore.html"><span class="ico">⌕</span>Explore</a>
        <a href="./about.html"><span class="ico">i</span>About</a>
      </nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <h1>Trends</h1>
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Search" autocomplete="off" aria-label="Search trends">
        </label>
      </header>
      <main>
        <div class="toolbar" id="listToolbar">
          <span class="live"><i></i>Live</span>
          <span class="count" id="heroSignalCount">—</span>
        </div>
        <div id="trendList" class="rows" aria-live="polite"></div>
      </main>
    </div>
  </div>
  <script src="./sheet.js"></script>
</body>
</html>
